name: Thesis Windows original fonts

on:
  push:
    branches: [codex/thesis-final-quality-20261113]
    paths:
      - .github/workflows/thesis-windows-fonts.yml
      - scripts/cloud/Invoke-ThesisWindows.ps1
      - scripts/documents/thesis_windows_cloud.py
      - scripts/documents/validate_thesis_delivery.py
      - scripts/documents/build_thesis_delivery.py
      - scripts/documents/audit_thesis_font_layout.py
      - scripts/documents/check_thesis_master_final.py
      - scripts/documents/thesis_final_figures.py
      - scripts/documents/build_thesis_border_figures.py
      - scripts/documents/check_thesis_border_polish.py
      - docs/thesis/border-polish-20261114/**
      - scripts/documents/update_delivery_page_map.py
      - scripts/documents/validate_thesis_references.py
      - docs/thesis/毕业论文.md
      - docs/thesis/final-master-20261114/**
      - docs/references/gb7714-list.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    if: >-
      github.ref == 'refs/heads/codex/thesis-final-quality-20261113'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      THESIS_DELIVERY_ID: thesis-windows-fonts-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Preserve repository bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document inspection dependencies
        run: python -m pip install python-docx==1.2.0 lxml==6.0.2 Pillow==12.0.0 PyMuPDF==1.26.6 fonttools==4.60.1 brotli==1.2.0
      - name: Check original fonts, try official Windows component, and render
        shell: pwsh
        run: ./scripts/cloud/Invoke-ThesisWindows.ps1
      - name: Retain output and real diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.THESIS_DELIVERY_ID }}
          path: |
            output/thesis/${{ env.THESIS_DELIVERY_ID }}/
            docs/validation/${{ env.THESIS_DELIVERY_ID }}/
          if-no-files-found: warn
          retention-days: 14

