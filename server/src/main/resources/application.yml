server:
  port: 8080

spring:
  application:
    name: wrongbook-server
  profiles:
    active: dev
  http:
    client:
      # 真实模型调用必须有明确边界，避免网络异常时无限等待
      connect-timeout: ${LLM_CONNECT_TIMEOUT:10s}
      read-timeout: ${LLM_READ_TIMEOUT:90s}
  # 从工作目录 .env 读取敏感配置（.env 不入库，见 .env.example）
  config:
    import: optional:file:./.env[.properties]
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 软删除标记：1 正常，0 删除/停用（user/subject/question 的 status 字段）
      logic-delete-value: 0
      logic-not-delete-value: 1

# 业务配置
app:
  # 图片识别仅是 Question 创建前的可选旁路，默认关闭，不写业务数据
  image-recognition:
    enabled: ${IMAGE_RECOGNITION_ENABLED:false}
    base-url: ${IMAGE_RECOGNITION_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    # 可复用同一个智谱 Key，但 Client 与模型配置保持隔离
    api-key: ${IMAGE_RECOGNITION_API_KEY:${LLM_API_KEY:}}
    model: ${IMAGE_RECOGNITION_MODEL:glm-5.3-flash}
    max-image-bytes: ${IMAGE_RECOGNITION_MAX_BYTES:5242880}
  # 大模型提供方：mock（默认、离线）/ glm / deepseek
  llm:
    provider: ${LLM_PROVIDER:mock}
    # 真实提供方的密钥与模型配置仅通过环境变量或未入库的 .env 注入
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    chat-model: ${LLM_CHAT_MODEL:}
    embedding-model: ${LLM_EMBEDDING_MODEL:}
    embedding-dimensions: ${LLM_EMBEDDING_DIMENSIONS:1024}
  jwt:
    # 未配置时每次启动生成随机密钥；正式演示/部署应通过 JWT_SECRET 保持重启后会话有效
    secret: ${JWT_SECRET:${random.uuid}}
    expire-hours: 24
  # 错题图片本地存储目录（相对 server 工作目录）
  upload-dir: ${UPLOAD_DIR:uploads}
