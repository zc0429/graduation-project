spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${TEST_DB_URL:jdbc:mysql://127.0.0.1:3307/wrongbook_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${TEST_DB_USERNAME:wrongbook_test_runner}
    password: ${TEST_DB_PASSWORD}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

app:
  image-recognition:
    enabled: false
  llm:
    provider: mock
  upload-dir: ${TEST_UPLOAD_DIR:target/test-uploads}
