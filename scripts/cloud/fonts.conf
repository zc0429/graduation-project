<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <!-- Explicit preview profile: prefer originals whenever present. Never use
       this profile to claim that a missing original has been installed. -->
  <alias binding="strong"><family>宋体</family><prefer><family>SimSun</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="strong"><family>SimSun</family><prefer><family>SimSun</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="strong"><family>黑体</family><prefer><family>SimHei</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="strong"><family>SimHei</family><prefer><family>SimHei</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="strong"><family>Times New Roman</family><prefer><family>Times New Roman</family><family>Liberation Serif</family></prefer></alias>
</fontconfig>
