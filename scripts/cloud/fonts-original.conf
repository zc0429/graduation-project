<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <!-- Localized names only; this profile declares no substitute families. -->
  <alias binding="strong"><family>宋体</family><prefer><family>SimSun</family></prefer></alias>
  <alias binding="strong"><family>黑体</family><prefer><family>SimHei</family></prefer></alias>
</fontconfig>
