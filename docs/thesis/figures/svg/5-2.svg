<rect x="30" y="226" width="386" height="49" fill="#ffffff" stroke="#292929" stroke-width=".7"/>
<text x="223.0" y="246.5" font-family="Times New Roman, SimSun, serif" font-size="9" text-anchor="middle" fill="black">应用内余弦相似度计算</text>
<text x="223.0" y="260.5" font-family="Times New Roman, SimSun, serif" font-size="9" text-anchor="middle" fill="black">保留相似度 &gt; 0，降序取最多 3 条</text>
