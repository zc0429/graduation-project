<text x="223.0" y="100.5" font-family="Times New Roman, SimSun, serif" font-size="9" text-anchor="middle" fill="black">embedding-3 生成题干向量</text>
<text x="223.0" y="114.5" font-family="Times New Roman, SimSun, serif" font-size="9" text-anchor="middle" fill="black">客户端检查 1024 维与有限数</text>
