<rect x="30" y="299" width="386" height="49" fill="#ffffff" stroke="#292929" stroke-width=".7"/>
<text x="223.0" y="319.5" font-family="Times New Roman, SimSun, serif" font-size="9" text-anchor="middle" fill="black">构造提示词：题干 + 可选答案 + 知识点候选</text>
<text x="223.0" y="333.5" font-family="Times New Roman, SimSun, serif" font-size="9" text-anchor="middle" fill="black">参考题只取题干片段（每题最多前 50 字）</text>
<polyline points="223,275 223,299" fill="none" stroke="#292929" stroke-width=".7" />
