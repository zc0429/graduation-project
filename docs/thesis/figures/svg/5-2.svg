<text x="223.0" y="406.5" font-family="Times New Roman, SimSun, serif" font-size="9" text-anchor="middle" fill="black">校验精确字段、候选 ID、难度 1-5 和中文文本</text>
<polyline points="223,348 223,372" fill="none" stroke="#292929" stroke-width=".7" />
