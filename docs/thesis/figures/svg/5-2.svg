<text x="223.0" y="496.5" font-family="Times New Roman, SimSun, serif" font-size="9" text-anchor="middle" fill="black">成功写入向量、归类、解析及 reference_ids</text>
<text x="223.0" y="510.5" font-family="Times New Roman, SimSun, serif" font-size="9" text-anchor="middle" fill="black">同事务发送完成消息</text>
<polyline points="223,421 223,463" fill="none" stroke="#292929" stroke-width=".7" />
<polygon points="223,463 220.12344676837478,457.73450462865776 225.87655323162522,457.73450462865776" fill="#292929" stroke="#292929" stroke-width=".7"/>
<text x="223" y="552" font-family="Times New Roman, SimSun, serif" font-size="9" text-anchor="middle" fill="black">空参考集仍可生成；异常记失败，输入过期则放弃旧结果回写。</text>
<text x="223" y="569" font-family="Times New Roman, SimSun, serif" font-size="9" text-anchor="middle" fill="black">RAG 不强制同知识点；reference_ids 记录本次实际参考题。</text>
</svg>