<svg xmlns="http://www.w3.org/2000/svg" width="484" height="501" viewBox="-19 -18 484 501"><rect x="18" y="6" width="410" height="43" fill="#ffffff" stroke="#292929" stroke-width=".8"></rect><text x="223.0" y="23.5" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">浏览器：</tspan><tspan font-family="Times New Roman">Vue 3 / Element Plus / Pinia / Vue Router</tspan></text><text x="223.0" y="37.5" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">富文本编辑、图表、</tspan><tspan font-family="Times New Roman">Axios </tspan><tspan font-family="Noto Serif CJK SC">请求与轮询</tspan></text><rect x="18" y="79" width="410" height="43" fill="#ffffff" stroke="#292929" stroke-width=".8"></rect><text x="223.0" y="96.5" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Times New Roman">Spring Boot </tspan><tspan font-family="Noto Serif CJK SC">接口层：</tspan><tspan font-family="Times New Roman">Controller + AuthInterceptor</tspan></text><text x="223.0" y="110.5" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Times New Roman">JWT </tspan><tspan font-family="Noto Serif CJK SC">校验、数据库角色与账号状态、参数校验</tspan></text><polyline data-role="connector" points="223,49 223,79" fill="none" stroke="#292929" stroke-width="0.8"></polyline><polygon data-role="arrowhead" points="223,79 220.4,73.0 225.6,73.0" fill="#292929" stroke="#292929" stroke-width=".8" stroke-linejoin="miter"></polygon><text x="266" y="68" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Times New Roman">HTTP / JSON</tspan></text><rect x="18" y="155" width="410" height="50" fill="#f2f2f2" stroke="#292929" stroke-width=".8"></rect><text x="223.0" y="176.0" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">业务服务层</tspan></text><text x="223.0" y="190.0" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">错题、</tspan><tspan font-family="Times New Roman">AI </tspan><tspan font-family="Noto Serif CJK SC">编排、</tspan><tspan font-family="Times New Roman">RAG</tspan><tspan font-family="Noto Serif CJK SC">、推荐、练习、复习、报告、消息</tspan></text><polyline data-role="connector" points="223,122 223,155" fill="none" stroke="#292929" stroke-width="0.8"></polyline><polygon data-role="arrowhead" points="223,155 220.4,149.0 225.6,149.0" fill="#292929" stroke="#292929" stroke-width=".8" stroke-linejoin="miter"></polygon><rect x="18" y="244" width="187" height="52" fill="#ffffff" stroke="#292929" stroke-width=".8"></rect><text x="111.5" y="259.0" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Times New Roman">MyBatis-Plus / Mapper</tspan></text><text x="111.5" y="273.0" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Times New Roman">MySQL 8</tspan><tspan font-family="Noto Serif CJK SC">：</tspan><tspan font-family="Times New Roman">11 </tspan><tspan font-family="Noto Serif CJK SC">张物理表</tspan></text><text x="111.5" y="287.0" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">题干向量为</tspan><tspan font-family="Times New Roman"> TEXT </tspan><tspan font-family="Noto Serif CJK SC">中的</tspan><tspan font-family="Times New Roman"> JSON</tspan></text><rect x="241" y="244" width="187" height="52" fill="#ffffff" stroke="#292929" stroke-width=".8"></rect><text x="334.5" y="259.0" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">本地文件存储</tspan></text><text x="334.5" y="273.0" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">题图只经所属学生详情返回</tspan></text><text x="334.5" y="287.0" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">数据库保存相对路径</tspan></text><polyline data-role="connector" points="108,205 108,244" fill="none" stroke="#292929" stroke-width="0.8"></polyline><polygon data-role="arrowhead" points="108,244 105.4,238.0 110.6,238.0" fill="#292929" stroke="#292929" stroke-width=".8" stroke-linejoin="miter"></polygon><polyline data-role="connector" points="335,205 335,244" fill="none" stroke="#292929" stroke-width="0.8"></polyline><polygon data-role="arrowhead" points="335,244 332.4,238.0 337.6,238.0" fill="#292929" stroke="#292929" stroke-width=".8" stroke-linejoin="miter"></polygon><rect x="18" y="341" width="187" height="65" fill="#ffffff" stroke="#292929" stroke-width=".8"></rect><text x="111.5" y="355.5" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Times New Roman">LlmClient </tspan><tspan font-family="Noto Serif CJK SC">模型网关</tspan></text><text x="111.5" y="369.5" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">智谱</tspan><tspan font-family="Times New Roman"> GLM </tspan><tspan font-family="Noto Serif CJK SC">大模型文本生成</tspan></text><text x="111.5" y="383.5" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">向量服务：</tspan><tspan font-family="Times New Roman">1024 </tspan><tspan font-family="Noto Serif CJK SC">维</tspan></text><text x="111.5" y="397.5" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Times New Roman">Mock </tspan><tspan font-family="Noto Serif CJK SC">用于离线与常规回归</tspan></text><rect x="241" y="341" width="187" height="65" fill="#ffffff" stroke="#292929" stroke-width=".8"></rect><text x="334.5" y="355.5" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">独立图片识别客户端</tspan></text><text x="334.5" y="369.5" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Times New Roman">GLM </tspan><tspan font-family="Noto Serif CJK SC">多模态识别（默认开启）</tspan></text><text x="334.5" y="383.5" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">单图识别只返回候选值</tspan></text><text x="334.5" y="397.5" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">识别阶段不写业务表</tspan></text><polyline data-role="connector" points="18,179 5,179 5,326 110,326 110,341" fill="none" stroke="#292929" stroke-width="0.8"></polyline><polygon data-role="arrowhead" points="110,341 107.4,335.0 112.6,335.0" fill="#292929" stroke="#292929" stroke-width=".8" stroke-linejoin="miter"></polygon><polyline data-role="connector" points="428,179 441,179 441,326 335,326 335,341" fill="none" stroke="#292929" stroke-width="0.8"></polyline><polygon data-role="arrowhead" points="335,341 332.4,335.0 337.6,335.0" fill="#292929" stroke="#292929" stroke-width=".8" stroke-linejoin="miter"></polygon><text x="223" y="436" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">外部模型通过</tspan><tspan font-family="Times New Roman"> HTTPS </tspan><tspan font-family="Noto Serif CJK SC">调用；密钥只在服务端配置。</tspan></text><text x="223" y="456" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">本地执行器处理异步解析；定时任务处理提醒，报告按请求聚合。</tspan></text></svg>