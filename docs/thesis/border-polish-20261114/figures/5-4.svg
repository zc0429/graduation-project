e-width=".8"></rect><text x="223.0" y="246.5" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">应用内余弦相似度计算</tspan></text><text x="223.0" y="260.5" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">保留相似度</tspan><tspan font-family="Times New Roman"> &gt; 0</tspan><tspan font-family="Noto Serif CJK SC">，降序取最多</tspan><tspan font-family="Times New Roman"> 3 </tspan><tspan font-family="Noto Serif CJK SC">条</tspan></text><polyline data-role="connector" points="223,202 223,226" fill="none" stroke="#292929" stroke-width="0.8"></polyline><polygon data-role="arrowhead" points="223,226 220.4,220.0 225.6,220.0" fill="#292929" stroke="#292929" stroke-width=".8" stroke-linejoin="miter"></polygon><rect x="30" y="299" width="386" height="49" fill="#ffffff" stroke="#292929" stroke-width=".8"></rect><text x="223.0" y="319.5" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">构造提示词：题干</tspan><tspan font-family="Times New Roman"> + </tspan><tspan font-family="Noto Serif CJK SC">可选答案</tspan><tspan font-family="Times New Roman"> + </tspan><tspan font-family="Noto Serif CJK SC">知识点候选</tspan></text><text x="223.0" y="333.5" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">参考题只取题干片段（每题最多前</tspan><tspan font-family="Times New Roman"> 50 </tspan><tspan font-family="Noto Serif CJK SC">字）</tspan></text><polyline data-role="connector" points="223,275 223,299" fill="none" stroke="#292929" stroke-width="0.8"></polyline><polygon data-role="arrowhead" points="223,299 220.4,293.0 225.6,293.0" fill="#292929" stroke="#292929" stroke-width=".8" stroke-linejoin="miter"></polygon><rect x="30" y="372" width="386" height="49" fill="#ffffff" stroke="#292929" stroke-width=".8"></rect><text x="223.0" y="392.5" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">调用智谱</tspan><tspan font-family=