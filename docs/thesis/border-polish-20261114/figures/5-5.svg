<svg xmlns="http://www.w3.org/2000/svg" width="473" height="444" viewBox="-9 -19 473 444"><rect x="15" y="5" width="90" height="36" fill="#f2f2f2" stroke="#292929" stroke-width=".8"></rect><text x="60.0" y="26.0" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">学生页面</tspan></text><polyline data-role="connector" points="60,41 60,351" fill="none" stroke="#292929" stroke-width="0.8" stroke-dasharray="3 2"></polyline><rect x="179" y="5" width="90" height="36" fill="#f2f2f2" stroke="#292929" stroke-width=".8"></rect><text x="224.0" y="26.0" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Times New Roman">PracticeService</tspan></text><polyline data-role="connector" points="224,41 224,351" fill="none" stroke="#292929" stroke-width="0.8" stroke-dasharray="3 2"></polyline><rect x="343" y="5" width="90" height="36" fill="#f2f2f2" stroke="#292929" stroke-width=".8"></rect><text x="388.0" y="26.0" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Times New Roman">Mapper / MySQL</tspan></text><polyline data-role="connector" points="388,41 388,351" fill="none" stroke="#292929" stroke-width="0.8" stroke-dasharray="3 2"></polyline><polyline data-role="connector" points="60,79 224,79" fill="none" stroke="#292929" stroke-width="0.8"></polyline><polygon data-role="arrowhead" points="224,79 218.0,81.6 218.0,76.4" fill="#292929" stroke="#292929" stroke-width=".8" stroke-linejoin="miter"></polygon><text x="142.0" y="72" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">作答与结果自评</tspan></text><rect x="147" y="97" width="154" height="56" fill="#ffffff" stroke="#292929" stroke-width=".8"></rect><text x="224.0" y="114.0" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">校验</tspan><tspan font-family="Times New Roman"> isCorrect </tspan><tspan font-family="Noto Serif CJK SC">为</tspan><tspan font-family="Times New Roman"> 0 </tspan><tspan font-family="Noto Serif CJK SC">或</tspan><tspan font-family="Times New Roman"> 1</tspan></text><text x="224.0" y="128.0" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Times New Roman">questionId / variantId </tspan><tspan font-family="Noto Serif CJK SC">二选一</tspan></text><text x="224.0" y="142.0" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">变式题回溯原题并检查归属</tspan></text><rect x="132" y="173" width="308" height="139" fill="#ffffff" stroke="#292929" stroke-width=".8"></rect><text x="286" y="188" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">同一事务的两步写操作（失败均回滚）</tspan></text><polyline data-role="connector" points="224,220 388,220" fill="none" stroke="#292929" stroke-width="0.8"></polyline><polygon data-role="arrowhead" points="388,220 382.0,222.6 382.0,217.4" fill="#292929" stroke="#292929" stroke-width=".8" stroke-linejoin="miter"></polygon><text x="306.0" y="213" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">插入练习记录</tspan></text><polyline data-role="connector" points="224,257 388,257" fill="none" stroke="#292929" stroke-width="0.8"></polyline><polygon data-role="arrowhead" points="388,257 382.0,259.6 382.0,254.4" fill="#292929" stroke="#292929" stroke-width=".8" stroke-linejoin="miter"></polygon><text x="306.0" y="250" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">原子更新原题</tspan><tspan font-family="Times New Roman"> mastery</tspan></text><text x="286" y="294" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">答对</tspan><tspan font-family="Times New Roman"> +15</tspan><tspan font-family="Noto Serif CJK SC">，答错</tspan><tspan font-family="Times New Roman"> -20</tspan><tspan font-family="Noto Serif CJK SC">，限制在</tspan><tspan font-family="Times New Roman"> 0-100</tspan></text><polyline data-role="connector" points="224,345 60,345" fill="none" stroke="#292929" stroke-width="0.8" stroke-dasharray="3 2"></polyline><polygon data-role="arrowhead" points="60,345 66.0,342.4 66.0,347.6" fill="#292929" stroke="#292929" stroke-width=".8" stroke-linejoin="miter"></polygon><text x="142.0" y="338" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">提交成功并刷新题目</tspan></text><text x="223" y="380" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">结果由学生自评提交，服务不执行自动判分。</tspan></text><text x="223" y="398" font-size="9" text-anchor="middle" xml:space="preserve"><tspan font-family="Noto Serif CJK SC">此操作不自动完成复习计划，也不触发相似题重排。</tspan></text></svg>